name: CI

# Runs the checks that previously only ran on someone's laptop. A PR that
# breaks typecheck, lint, or a unit test now says so before anyone merges it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches NODE_VERSION in netlify.toml so CI and the deploy build agree.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated rather than committed, and the typecheck
      # imports its types. This contacts no database.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

# Playwright is deliberately not run here. Those specs drive a real dev server
# against a real Supabase database and sign in as a staff user, so they need
# secrets and a reachable DB rather than a clean CI container. They stay a
# local step - see HANDOFF.md.
